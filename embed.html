<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>DJ Battle player</title>
  <style>
    :root{--bg:#0d1118;--panel:#121823;--line:#252c38;--text:#f4f7fb;--muted:#a3adbd;--accent:#b9ff31;--accent-ink:#111606;--link:#b9ff31}
    html[data-theme="light"]{--bg:#ffffff;--panel:#f3f5f9;--line:#d3d9e3;--text:#121826;--muted:#4a5568;--accent:#2f6400;--accent-ink:#ffffff;--link:#2f6400}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .card{display:flex;flex-direction:column;gap:10px;padding:14px;height:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
    .top{display:flex;align-items:center;gap:12px;min-width:0}
    .play{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:18px;font-weight:900;cursor:pointer;display:grid;place-items:center;text-decoration:none}
    .meta{min-width:0;flex:1}
    .meta strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .meta small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .score{flex:none;text-align:right}
    .score b{display:block;font-size:24px;line-height:1}
    .score small{color:var(--muted);font-size:11px}
    .wave{height:34px;display:flex;align-items:center;gap:2px;position:relative}
    .wave i{flex:1;background:var(--muted);opacity:.5;border-radius:2px}
    .wave .done{background:var(--accent);opacity:1}
    .foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .brand{font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--muted)}
    .cta{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--link);font-weight:800;font-size:13px;text-decoration:none;white-space:nowrap}
    .msg{color:var(--muted);font-size:13px;margin:auto 0}
  </style>
</head>
<body>
  <main class="card" id="embed-root" aria-live="polite"><p class="msg">Loading…</p></main>
  <script src="supabase-browser-config.local.js"></script>
  <script src="api_client.20bb2c98c3.js"></script>
  <script src="embed.js"></script>
</body>
</html>
