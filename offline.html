<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0f14" />
  <title>You're offline · DJ Battle</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <style>
    :root{color-scheme:dark}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0f14;color:#e8edf2;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;box-sizing:border-box}
    main{max-width:420px;text-align:center}
    img{width:88px;height:88px;border-radius:20px}
    h1{font-size:1.6rem;margin:18px 0 8px;color:#b9ff31}
    p{color:#9aa7b4;margin:0 0 14px}
    button{background:#b9ff31;color:#0b0f14;border:0;border-radius:10px;padding:12px 22px;font-weight:800;font-size:1rem;cursor:pointer}
    small{display:block;margin-top:18px;color:#6f7c89}
  </style>
</head>
<body>
  <main>
    <img src="assets/icon-192.png" alt="DJ Battle" />
    <h1>You're offline</h1>
    <p>DJ Battle can't reach the internet right now. Your music, practice log and drafts saved in this browser are safe.</p>
    <p>Battles, rankings and the Beat Store need a connection, so they'll come back as soon as you do.</p>
    <button type="button" id="offline-retry">Try again</button>
    <small id="offline-status" aria-live="polite"></small>
  </main>
  <script>
    document.getElementById('offline-retry').addEventListener('click', function(){
      document.getElementById('offline-status').textContent = navigator.onLine ? 'Reconnecting…' : 'Still offline. We\'ll reload when you\'re back.';
      if(navigator.onLine) location.href = './index.html';
    });
    window.addEventListener('online', function(){ location.href = './index.html'; });
  </script>
</body>
</html>
